name: Publicar visor en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '00 Code/**'
      - '02 Input/**'
      - '.github/workflows/publicar-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v6
      - name: Preparar Pages
        uses: actions/configure-pages@v5
      - name: Reconstruir y verificar los recursos cifrados
        run: python3 -B "00 Code/herramientas/preparar_publicacion.py" --salida "03 Output/PAGES"
      - name: Subir exclusivamente la web
        uses: actions/upload-pages-artifact@v4
        with:
          path: '03 Output/PAGES/dist'
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
